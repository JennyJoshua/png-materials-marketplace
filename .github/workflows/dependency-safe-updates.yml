name: Safe dependency updates

on:
  push:
    branches:
      - security/dependency-advisory-remediation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Update only compatible PostCSS and Vite releases
        run: npm update postcss vite --package-lock-only --ignore-scripts
      - name: Install updated locked dependencies
        run: npm ci --ignore-scripts
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Validate Prisma schema
        run: npm run db:validate
      - name: Run tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Upload candidate lockfile
        uses: actions/upload-artifact@v4
        with:
          name: safe-updated-package-lock
          path: package-lock.json
