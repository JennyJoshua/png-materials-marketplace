name: Dependency security audit

on:
  push:
    branches:
      - security/dependency-advisory-remediation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run npm security audit
        id: audit
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json
          code=$?
          echo "audit_exit_code=$code" >> "$GITHUB_OUTPUT"
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities ?? {};
          const lines = [
            '## Dependency security audit',
            '',
            '| Severity | Count |',
            '|---|---:|',
            ...['critical','high','moderate','low','info'].map(k => `| ${k} | ${counts[k] ?? 0} |`),
            '',
            '| Package | Severity | Direct | Installed range | Fix available | Advisory |',
            '|---|---|---:|---|---|---|',
          ];
          for (const [name, v] of Object.entries(report.vulnerabilities ?? {})) {
            for (const item of v.via ?? []) {
              if (typeof item === 'string') continue;
              lines.push(`| ${name} | ${v.severity} | ${v.isDirect} | ${v.range} | ${JSON.stringify(v.fixAvailable)} | [${item.title}](${item.url}) |`);
            }
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          console.log(JSON.stringify({ counts, packages: Object.entries(report.vulnerabilities ?? {}).map(([name,v]) => ({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:v.via})) }, null, 2));
          NODE
      - name: Upload full audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-dependency-audit
          path: npm-audit.json
          if-no-files-found: error
